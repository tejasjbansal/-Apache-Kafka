<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>

  <!-- Titles -->
  <text x="190" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Batch Processing</text>
  <text x="570" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Streaming Processing</text>

  <!-- Divider -->
  <line x1="380" y1="10" x2="380" y2="330" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Batch side: data collects then processes in chunks -->
  <g>
    <rect x="40" y="60" width="60" height="40" rx="4" fill="#cbd5f0"/>
    <rect x="110" y="60" width="60" height="40" rx="4" fill="#cbd5f0"/>
    <rect x="180" y="60" width="60" height="40" rx="4" fill="#cbd5f0"/>
    <rect x="250" y="60" width="60" height="40" rx="4" fill="#cbd5f0"/>
    <text x="190" y="120" text-anchor="middle" font-size="13" fill="#333">Data accumulates over time</text>

    <line x1="190" y1="135" x2="190" y2="165" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="110" y="170" width="160" height="50" rx="6" fill="#4c5fd5"/>
    <text x="190" y="200" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">Scheduled Job</text>
    <text x="190" y="215" text-anchor="middle" font-size="11" fill="#e0e3ff">(e.g. nightly / hourly)</text>

    <line x1="190" y1="220" x2="190" y2="250" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="130" y="255" width="120" height="40" rx="6" fill="#2ecc71"/>
    <text x="190" y="280" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">Processed Output</text>

    <text x="190" y="320" text-anchor="middle" font-size="12" fill="#666">High latency, high throughput</text>
  </g>

  <!-- Streaming side: continuous events flowing -->
  <g>
    <text x="570" y="120" text-anchor="middle" font-size="13" fill="#333">Events processed as they arrive</text>

    <circle cx="430" cy="170" r="14" fill="#f39c12"/>
    <circle cx="475" cy="170" r="14" fill="#f39c12"/>
    <circle cx="520" cy="170" r="14" fill="#f39c12"/>
    <circle cx="565" cy="170" r="14" fill="#f39c12"/>
    <circle cx="610" cy="170" r="14" fill="#f39c12"/>
    <circle cx="655" cy="170" r="14" fill="#f39c12"/>
    <circle cx="700" cy="170" r="14" fill="#f39c12"/>

    <line x1="420" y1="170" x2="710" y2="170" stroke="#f0c060" stroke-width="2" stroke-dasharray="2,4"/>

    <line x1="570" y1="190" x2="570" y2="250" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="490" y="255" width="160" height="40" rx="6" fill="#2ecc71"/>
    <text x="570" y="280" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">Continuous Output</text>

    <text x="570" y="320" text-anchor="middle" font-size="12" fill="#666">Low latency, near real-time</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
