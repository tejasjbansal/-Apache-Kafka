<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="320" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Consumer Groups &amp; Partition Assignment</text>

  <!-- Topic with 4 partitions -->
  <text x="120" y="65" font-size="13" font-weight="700" fill="#333">Topic "orders" (4 partitions)</text>
  <rect x="40" y="75" width="80" height="44" rx="4" fill="#4c5fd5"/>
  <text x="80" y="102" text-anchor="middle" font-size="12" fill="#fff">P0</text>
  <rect x="130" y="75" width="80" height="44" rx="4" fill="#5a6de0"/>
  <text x="170" y="102" text-anchor="middle" font-size="12" fill="#fff">P1</text>
  <rect x="220" y="75" width="80" height="44" rx="4" fill="#6879e8"/>
  <text x="260" y="102" text-anchor="middle" font-size="12" fill="#fff">P2</text>
  <rect x="310" y="75" width="80" height="44" rx="4" fill="#7686ee"/>
  <text x="350" y="102" text-anchor="middle" font-size="12" fill="#fff">P3</text>

  <!-- Consumer Group A: 2 consumers -->
  <rect x="40" y="160" width="350" height="140" rx="8" fill="#f4f6ff" stroke="#c3c9f0" stroke-width="2"/>
  <text x="215" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Consumer Group A (2 consumers)</text>

  <rect x="60" y="195" width="140" height="44" rx="6" fill="#2ecc71"/>
  <text x="130" y="222" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Consumer A1</text>
  <text x="130" y="255" text-anchor="middle" font-size="11" fill="#333">reads P0, P1</text>

  <rect x="230" y="195" width="140" height="44" rx="6" fill="#2ecc71"/>
  <text x="300" y="222" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Consumer A2</text>
  <text x="300" y="255" text-anchor="middle" font-size="11" fill="#333">reads P2, P3</text>

  <text x="215" y="280" text-anchor="middle" font-size="11" fill="#555">Each partition is read by exactly one consumer in the group</text>

  <!-- Consumer Group B: 1 consumer reading everything -->
  <rect x="420" y="160" width="300" height="140" rx="8" fill="#fff7e8" stroke="#e6c877" stroke-width="2"/>
  <text x="570" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5b00">Consumer Group B (1 consumer)</text>

  <rect x="500" y="200" width="140" height="44" rx="6" fill="#f39c12"/>
  <text x="570" y="227" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">Consumer B1</text>
  <text x="570" y="260" text-anchor="middle" font-size="11" fill="#333">reads P0, P1, P2, P3</text>

  <!-- arrows from topic to groups -->
  <line x1="215" y1="119" x2="215" y2="160" stroke="#888" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="350" y1="119" x2="570" y2="160" stroke="#888" stroke-width="2" marker-end="url(#arrow3)"/>

  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
