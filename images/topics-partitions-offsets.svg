<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Topic "orders" — Partitions &amp; Offsets</text>

  <!-- Partition 0 -->
  <text x="40" y="70" font-size="13" font-weight="700" fill="#333">Partition 0</text>
  <g>
    <rect x="40" y="80" width="50" height="40" fill="#4c5fd5"/>
    <rect x="90" y="80" width="50" height="40" fill="#5a6de0"/>
    <rect x="140" y="80" width="50" height="40" fill="#6879e8"/>
    <rect x="190" y="80" width="50" height="40" fill="#7686ee"/>
    <rect x="240" y="80" width="50" height="40" fill="#8493f2" stroke="#333" stroke-dasharray="3,2"/>
    <text x="65" y="105" text-anchor="middle" font-size="11" fill="#fff">0</text>
    <text x="115" y="105" text-anchor="middle" font-size="11" fill="#fff">1</text>
    <text x="165" y="105" text-anchor="middle" font-size="11" fill="#fff">2</text>
    <text x="215" y="105" text-anchor="middle" font-size="11" fill="#fff">3</text>
    <text x="265" y="105" text-anchor="middle" font-size="11" fill="#fff">4</text>
    <text x="330" y="105" font-size="11" fill="#888">← new writes</text>
  </g>

  <!-- Partition 1 -->
  <text x="40" y="150" font-size="13" font-weight="700" fill="#333">Partition 1</text>
  <g>
    <rect x="40" y="160" width="50" height="40" fill="#2ecc71"/>
    <rect x="90" y="160" width="50" height="40" fill="#3ed37c"/>
    <rect x="140" y="160" width="50" height="40" fill="#4ed988" stroke="#333" stroke-dasharray="3,2"/>
    <text x="65" y="185" text-anchor="middle" font-size="11" fill="#fff">0</text>
    <text x="115" y="185" text-anchor="middle" font-size="11" fill="#fff">1</text>
    <text x="165" y="185" text-anchor="middle" font-size="11" fill="#fff">2</text>
    <text x="220" y="185" font-size="11" fill="#888">← new writes</text>
  </g>

  <!-- Partition 2 -->
  <text x="40" y="230" font-size="13" font-weight="700" fill="#333">Partition 2</text>
  <g>
    <rect x="40" y="240" width="50" height="40" fill="#f39c12"/>
    <rect x="90" y="240" width="50" height="40" fill="#f5a935" stroke="#333" stroke-dasharray="3,2"/>
    <text x="65" y="265" text-anchor="middle" font-size="11" fill="#fff">0</text>
    <text x="115" y="265" text-anchor="middle" font-size="11" fill="#fff">1</text>
    <text x="170" y="265" font-size="11" fill="#888">← new writes</text>
  </g>

  <!-- Notes -->
  <text x="470" y="90" font-size="11" fill="#555">• Each box = 1 message</text>
  <text x="470" y="108" font-size="11" fill="#555">• Number = offset (position in partition)</text>
  <text x="470" y="126" font-size="11" fill="#555">• Offsets are only unique per partition</text>
  <text x="470" y="144" font-size="11" fill="#555">• Order is guaranteed within a partition,</text>
  <text x="470" y="160" font-size="11" fill="#555">&#160;&#160;not across the whole topic</text>
  <text x="470" y="182" font-size="11" fill="#555">• New messages always append to the end</text>
</svg>
