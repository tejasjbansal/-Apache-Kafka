<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Kafka Cluster Architecture (KRaft mode)</text>

  <!-- Producers -->
  <rect x="20" y="80" width="120" height="46" rx="6" fill="#4c5fd5"/>
  <text x="80" y="108" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Producer A</text>
  <rect x="20" y="150" width="120" height="46" rx="6" fill="#4c5fd5"/>
  <text x="80" y="178" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Producer B</text>

  <!-- Arrows producers -> broker cluster -->
  <line x1="140" y1="103" x2="240" y2="150" stroke="#888" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="140" y1="173" x2="240" y2="180" stroke="#888" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Broker cluster box -->
  <rect x="245" y="70" width="330" height="220" rx="10" fill="#f4f6ff" stroke="#c3c9f0" stroke-width="2"/>
  <text x="410" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Kafka Broker Cluster</text>

  <!-- Broker 1 -->
  <rect x="265" y="105" width="90" height="70" rx="6" fill="#dfe6fb" stroke="#8f9fe0"/>
  <text x="310" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Broker 1</text>
  <text x="310" y="148" text-anchor="middle" font-size="10" fill="#444">Topic-A P0</text>
  <text x="310" y="162" text-anchor="middle" font-size="10" fill="#444">Topic-B P1</text>

  <!-- Broker 2 -->
  <rect x="365" y="105" width="90" height="70" rx="6" fill="#dfe6fb" stroke="#8f9fe0"/>
  <text x="410" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Broker 2</text>
  <text x="410" y="148" text-anchor="middle" font-size="10" fill="#444">Topic-A P1</text>
  <text x="410" y="162" text-anchor="middle" font-size="10" fill="#444">Topic-B P0</text>

  <!-- Broker 3 -->
  <rect x="465" y="105" width="90" height="70" rx="6" fill="#dfe6fb" stroke="#8f9fe0"/>
  <text x="510" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Broker 3</text>
  <text x="510" y="148" text-anchor="middle" font-size="10" fill="#444">Topic-A P2</text>
  <text x="510" y="162" text-anchor="middle" font-size="10" fill="#444">Topic-B P2</text>

  <!-- KRaft controller quorum -->
  <rect x="300" y="200" width="220" height="60" rx="6" fill="#fff3d6" stroke="#e0b84a"/>
  <text x="410" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5b00">KRaft Controller Quorum</text>
  <text x="410" y="240" text-anchor="middle" font-size="10" fill="#7a5b00">(metadata log, leader election,</text>
  <text x="410" y="252" text-anchor="middle" font-size="10" fill="#7a5b00">replaces ZooKeeper)</text>

  <!-- Arrows broker cluster -> consumers -->
  <line x1="575" y1="150" x2="660" y2="103" stroke="#888" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="575" y1="180" x2="660" y2="173" stroke="#888" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Consumers -->
  <rect x="660" y="80" width="120" height="46" rx="6" fill="#2ecc71"/>
  <text x="720" y="108" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Consumer A</text>
  <rect x="660" y="150" width="120" height="46" rx="6" fill="#2ecc71"/>
  <text x="720" y="178" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Consumer B</text>

  <!-- Legend -->
  <text x="410" y="330" text-anchor="middle" font-size="11" fill="#555">Each topic is split into partitions, distributed and replicated across brokers.</text>
  <text x="410" y="348" text-anchor="middle" font-size="11" fill="#555">Producers write to partitions; consumers read from them independently.</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
